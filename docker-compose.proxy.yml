# Оверлей для сервера, где 80 и 443 уже заняты другим обратным прокси
# (nginx-proxy-manager, Traefik, Caddy, чужой nginx в контейнере).
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# Наши nginx и certbot выключены — TLS выпускает существующий прокси.
# Контейнер api дополнительно подключается к его сети, чтобы прокси мог
# обращаться к нему по имени, без публикации портов наружу.
#
# В .env указать имя внешней сети:
#   PROXY_NETWORK=имя_сети_прокси   (docker network ls)
#
# Дальше в прокси отдать нам весь домен: сайт живёт в корне, админка
# под /admin, вебхуки под /webhooks — всё это один контейнер.
#   <домен> -> http://router-shop-api:8000

services:
  nginx:
    profiles: ["disabled"]

  certbot:
    profiles: ["disabled"]

  api:
    networks:
      default: {}
      proxy:
        aliases: [router-shop-api]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
