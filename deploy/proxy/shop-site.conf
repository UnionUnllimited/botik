# Витрина на titanvps.pro. Кладётся в /etc/nginx/conf.d/ на 5.34.214.243.
#
# ORIGIN_IP подставляется одной командой при установке, см. README.
#
# Сюда трафик приходит не с 443 напрямую, а из stream-sni.conf через
# локальный хоп с PROXY-протоколом — отсюда `proxy_protocol` в listen
# и `real_ip_header`. Без них в журналах и в лимитах стоял бы 127.0.0.1.
#
# До origin идём по TLS с самоподписанным сертификатом: публичного имени
# у origin больше нет, а значит нет и сертификата от Let's Encrypt —
# и записи в CT-логах, по которой его находят. Проверяем не имя в доверенных
# корнях, а конкретный сертификат: proxy_ssl_trusted_certificate.

upstream shop_origin {
    server ORIGIN_IP:8443;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name titanvps.pro;

    # Обновление сертификата. Всё остальное на 80 не живёт.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name titanvps.pro;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/titanvps.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titanvps.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    client_max_body_size 32m;

    proxy_http_version 1.1;
    # Host отдаём наш, а не origin: приложение собирает абсолютные ссылки
    # по нему и по API_PUBLIC_BASE_URL. Просочится старое имя — витрина
    # покажет его в адресе первой же картинки каталога.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;

    proxy_ssl_server_name on;
    proxy_ssl_name titanvps.pro;
    proxy_ssl_trusted_certificate /etc/nginx/origin-ca.pem;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    # Метрики наружу не отдаём — так же, как на origin.
    location = /metrics {
        deny all;
    }

    location / {
        proxy_pass https://shop_origin;
        proxy_set_header Connection "";
    }
}
