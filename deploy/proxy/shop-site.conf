# Витрина на titanvps.pro. Кладётся в /etc/nginx/conf.d/ на 5.34.214.243.
#
# Сюда трафик приходит не с 443, а из stream-sni.conf: Xray отдал нам
# поток через `dest`, разделитель прочитал имя и передал сюда.
#
# Адрес клиента до нас не доезжает и доехать не может: соединение пришло
# от Xray с петли. Поэтому ни PROXY-протокола, ни real_ip тут нет — они
# создавали бы видимость точности там, где её нет.
#
# На origin ничего не ставится и не открывается: идём в тот же Caddy,
# который там уже работает, и с тем же его сертификатом. Поэтому
# `Host` и SNI уходят со старым именем — иначе Caddy не найдёт свой сайт
# и ответит 404. На адреса картинок и ссылок это не влияет: приложение
# собирает их из API_PUBLIC_BASE_URL, а не из заголовка запроса.
#
# Цена решения: origin остаётся публично доступным под старым именем.
# Спрятать его — отдельная работа: своё имя у него должно исчезнуть,
# а сертификат стать самоподписанным (заготовка — docker-compose.origin.yml).

upstream shop_origin {
    server 82.197.73.251:443;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name titanvps.pro;

    # Продление сертификата webroot-ом: nginx с 80 не уходит, простоя нет.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 параметром listen, а не отдельной директивой `http2 on`:
    # та появилась в nginx 1.25, а в Ubuntu 24.04 приезжает 1.24.
    # Порт 8543, а не 8443: 8443 на этой машине держит панель x-ui.
    listen 127.0.0.1:8543 ssl http2;
    server_name titanvps.pro;

    ssl_certificate     /etc/letsencrypt/live/titanvps.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titanvps.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Host vbotrouters.titanvps.click;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;

    # Сертификат у origin настоящий, от Let's Encrypt, — проверяем обычными
    # корнями системы. Имя в SNI то же, что в Host: по нему Caddy выбирает сайт.
    proxy_ssl_server_name on;
    proxy_ssl_name vbotrouters.titanvps.click;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;

    # Метрики наружу не отдаём.
    location = /metrics {
        deny all;
    }

    location / {
        proxy_pass https://shop_origin;
        proxy_set_header Connection "";
    }
}
