# Витрина на отдельной ВМ-прокси. Кладётся в /etc/nginx/conf.d/.
#
# ВМ своя, 443 на ней свободен — никаких stream и SNI-разделителей не нужно,
# обычный vhost. Разделитель понадобился бы, только если прокси придётся
# делить хост с remnanode; на этот случай рядом лежит stream-sni.conf.
#
# До origin идём по TLS с самоподписанным сертификатом: публичного имени
# у origin больше нет, а значит нет и сертификата от Let's Encrypt —
# и записи в CT-логах, по которой его находят. Проверяем не имя в доверенных
# корнях, а конкретный сертификат: proxy_ssl_trusted_certificate.

upstream shop_origin {
    # ORIGIN_IP — адрес сервера с приложением. Наружу его 8443 закрыт
    # файрволом на адрес этой ВМ, см. README, шаг 4.
    server ORIGIN_IP:8443;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name routers.titanvps.pro;

    # Обновление сертификата. Всё остальное на 80 не живёт.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name routers.titanvps.pro;

    ssl_certificate     /etc/letsencrypt/live/routers.titanvps.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/routers.titanvps.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    client_max_body_size 32m;

    proxy_http_version 1.1;
    # Host отдаём наш, а не origin: приложение собирает абсолютные ссылки
    # по нему и по API_PUBLIC_BASE_URL. Просочится старое имя — витрина
    # покажет его в адресе первой же картинки каталога.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;

    proxy_ssl_server_name on;
    proxy_ssl_name routers.titanvps.pro;
    proxy_ssl_trusted_certificate /etc/nginx/origin-ca.pem;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    # Метрики наружу не отдаём — так же, как на origin.
    location = /metrics {
        deny all;
    }

    location / {
        proxy_pass https://shop_origin;
        proxy_set_header Connection "";
    }
}

# Кто пришёл по адресу, а не по имени, — получает закрытую дверь, а не
# витрину: иначе прокси сам показывает, что за ним что-то есть.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/routers.titanvps.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/routers.titanvps.pro/privkey.pem;

    return 444;
}
