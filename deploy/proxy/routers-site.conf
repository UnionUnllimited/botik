# Витрина и второй адрес для списков и прошивок на сервере-прокси.
# Кладётся в /etc/nginx/conf.d/ (блок http).
#
# Сюда трафик приходит не с 443 напрямую, а из stream-sni.conf через
# локальный хоп с PROXY-протоколом — отсюда `proxy_protocol` в listen
# и `real_ip_header`. Без них в журналах и в лимитах стоял бы 127.0.0.1.
#
# До origin идём по TLS с самоподписанным сертификатом: публичного имени
# у origin больше нет, а значит нет и сертификата от Let's Encrypt —
# и записи в CT-логах, по которой его находят. Проверяем не имя, а
# конкретный сертификат: `proxy_ssl_trusted_certificate`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream shop_origin {
    # Адрес origin. Наружу он закрыт файрволом на этот IP — см. README, шаг 5.
    server 82.197.73.251:8443;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name routers.titanvps.pro cdn.titanvps.pro;

    # Обновление сертификата. Всё остальное на 80 не живёт.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name routers.titanvps.pro;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/routers.titanvps.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/routers.titanvps.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    client_max_body_size 32m;

    proxy_http_version 1.1;
    # Host отдаём наш, а не origin: приложение собирает абсолютные ссылки
    # из API_PUBLIC_BASE_URL, и если туда просочится старое имя, витрина
    # покажет его в адресах картинок на первом же экране.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;

    proxy_ssl_server_name on;
    proxy_ssl_name routers.titanvps.pro;
    proxy_ssl_trusted_certificate /etc/nginx/origin-ca.pem;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    # Метрики наружу не отдаём — так же, как на origin.
    location = /metrics {
        deny all;
    }

    location / {
        proxy_pass https://shop_origin;
        proxy_set_header Connection "";
    }
}

# Второй адрес: списки доменов и прошивки. Отдельным именем, потому что
# ходят по нему роутеры, а не люди: адрес зашит в прошивку, и менять его
# потом сложнее, чем адрес витрины.
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name cdn.titanvps.pro;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/cdn.titanvps.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.titanvps.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 160m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_ssl_server_name on;
    proxy_ssl_name cdn.titanvps.pro;
    proxy_ssl_trusted_certificate /etc/nginx/origin-ca.pem;
    proxy_ssl_verify on;

    # Образ прошивки — десятки мегабайт, и роутер тянет его по домашнему
    # каналу. Буферизация тут только мешает: nginx сначала складывал бы
    # весь файл к себе на диск.
    proxy_buffering off;
    proxy_read_timeout 300s;

    location /firmware/ {
        proxy_pass https://shop_origin;
        proxy_set_header Connection "";
    }

    location /lists/ {
        proxy_pass https://shop_origin;
        proxy_set_header Connection "";
    }

    # Ничего, кроме списков и прошивок, с этого имени не отдаём: чем меньше
    # на нём висит, тем меньше поводов его разглядывать.
    location / {
        return 404;
    }
}
