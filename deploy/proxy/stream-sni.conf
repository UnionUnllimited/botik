# Разведение по SNI ПОСЛЕ Xray, а не перед ним.
#
# На машине два хозяина 443: x-ui (VLESS+Reality, клиенты приходят с именем
# www.amd.com) и нода Remnawave. Ставить nginx впереди значит отбирать порт
# у одного из них — а этого можно не делать вовсе.
#
# У Reality есть `dest`: туда Xray целиком отдаёт TCP-поток тех, кто пришёл
# не с его именем. Раньше там стоял www.amd.com:443, теперь — этот блок.
# Xray отдаёт нам сырое приветствие TLS, мы читаем из него имя и решаем,
# кому отдать дальше. Порты при этом не двигаются ни у кого.
#
# Кладётся в /etc/nginx/stream.d/, при подключённом
#   stream { include /etc/nginx/stream.d/*.conf; }
# в /etc/nginx/nginx.conf.

map $ssl_preread_server_name $backend_dest {
    # Витрина — её TLS терминируем сами, блоком в conf.d/shop-site.conf.
    titanvps.pro   shop;

    # Всё прочее — ноде. Умолчание именно такое: нода сама прикрыта
    # камуфляжем, и незнакомое имя должно вести себя как раньше. Поставь
    # мы сюда витрину — случайный сканер увидел бы магазин там, где
    # раньше был чужой сайт.
    default        remnanode;
}

upstream shop {
    # 8443 не берём: его на этой машине держит веб-панель x-ui.
    server 127.0.0.1:8543;
}

upstream remnanode {
    # Инбаунд ноды Remnawave, порт задан в её панели.
    server 127.0.0.1:9443;
}

server {
    # Сюда смотрит `dest` у инбаунда x-ui. Только петля: снаружи этот порт
    # не нужен и не должен быть виден.
    listen 127.0.0.1:8544;

    ssl_preread on;
    proxy_pass $backend_dest;

    # Нода держит длинные соединения, обрывать их нельзя.
    proxy_timeout 10m;
    proxy_connect_timeout 5s;
}
