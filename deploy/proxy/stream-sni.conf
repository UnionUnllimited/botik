# ЗАПАСНОЙ ВАРИАНТ. Сейчас не используется.
#
# Нужен, только если прокси придётся ставить на тот же хост, где живёт
# remnanode. По плану от 31 августа прокси уезжает на отдельную ВМ, где
# 443 свободен, — там достаточно обычного vhost из shop-site.conf,
# а ноду не трогаем вовсе. Этот файл оставлен на случай, если отдельной
# ВМ не станет.
#
# Разделение 443 по SNI на хосте, где 443 уже занят нодой.
#
# На этом сервере уже живёт remnanode и держит 443 целиком: на любой
# неузнанный запрос она отдаёт камуфляж (сертификат amd.com). Отобрать
# у неё порт нельзя — на нём клиенты. Поэтому впереди встаёт nginx,
# смотрит SNI и разводит: наши имена — к витрине, всё остальное —
# ноде, ровно как было.
#
# Кладётся в /etc/nginx/stream.d/, а в /etc/nginx/nginx.conf на верхнем
# уровне — РЯДОМ с http {}, а не внутри него:
#
#   stream {
#       include /etc/nginx/stream.d/*.conf;
#   }
#
# Нужен модуль ngx_stream_ssl_preread — он есть в пакетах nginx и
# nginx-full из репозиториев Debian и Ubuntu.
#
# ВАЖНО: ssl_preread только читает приветствие клиента, не расшифровывая
# его. Трафик ноды идёт насквозь, Reality не ломается — для него это
# такой же прозрачный TCP, как раньше.

map $ssl_preread_server_name $backend_443 {
    # Витрина — наша, её терминируем сами.
    #
    # Второе имя под списки и прошивки (cdn.titanvps.pro) отложено: роутеры
    # пока тянут списки со старого сервера vm171085, а адрес манифеста
    # в прошивку ещё не прописан. Когда дойдут руки — строка добавляется
    # сюда и vhost в shop-site.conf.
    titanvps.pro   shop_inbound;

    # Всё прочее, включая пустой SNI и подставной SNI Reality, — ноде.
    # Умолчание именно такое: незнакомое имя должно вести себя как раньше,
    # иначе мы своими руками сделаем ноду заметной.
    default                remnanode;
}

upstream shop_inbound {
    server 127.0.0.1:8442;
}

upstream remnanode {
    # Порт, на который переехала нода. Менять здесь и в её compose
    # одновременно — см. README, шаг 2.
    server 127.0.0.1:8444;
}

server {
    listen 443 reuseport;
    listen [::]:443 reuseport;

    ssl_preread on;
    proxy_pass $backend_443;

    # Нода держит длинные соединения, обрывать их нельзя.
    proxy_timeout 10m;
    proxy_connect_timeout 5s;
}

# Промежуточный хоп только для нашего трафика: добавляет PROXY-протокол,
# чтобы витрина видела адрес клиента, а не 127.0.0.1. Прямо в блоке выше
# его включить нельзя — `proxy_protocol` не принимает переменную, и нода,
# которая его не понимает, получила бы мусор в первых байтах и порвала
# бы все соединения разом.
server {
    listen 127.0.0.1:8442;
    proxy_pass 127.0.0.1:8443;
    proxy_protocol on;
    proxy_timeout 75s;
}
