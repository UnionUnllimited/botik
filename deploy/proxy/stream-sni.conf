# Разделение 443 по SNI на titanvps.pro (5.34.214.243).
#
# nginx владеет 443 и раздаёт по именам: витрина — себе, всё прочее — x-ui,
# у которой камуфляж под www.amd.com. Обе панели при этом слушают свои
# порты на петле, наружу торчит только nginx.
#
# Клиенты панелей ничего не замечают: они как ходили на 443, так и ходят,
# с теми же именами. Меняется лишь то, на каком порту панель слушает.
#
# Записи в DNS не трогаются: titanvps.pro уже резолвится на этот адрес.
#
# Кладётся в /etc/nginx/stream.d/, при подключённом
#   stream { include /etc/nginx/stream.d/*.conf; }
# в /etc/nginx/nginx.conf. Нужен модуль ngx_stream_ssl_preread —
# пакет libnginx-mod-stream.
#
# ВАЖНО: ssl_preread только читает приветствие клиента, не расшифровывая
# его. Трафик панелей идёт насквозь, Reality не ломается.

map $ssl_preread_server_name $backend_443 {
    # Витрина — её TLS терминируем сами, блоком в conf.d/shop-site.conf.
    titanvps.pro   shop;

    # Нода Remnawave. Её имя вписать сюда, когда будет известно: пока
    # строки нет, клиенты ноды с 443 к ней не попадают.
    # <имя-ноды>   remnanode;

    # Всё прочее — x-ui. Умолчание не «наше» намеренно: у x-ui камуфляж
    # под www.amd.com, и незнакомое имя должно вести себя ровно как
    # раньше. Поставь мы сюда витрину — случайный сканер увидел бы
    # магазин там, где раньше был чужой сайт.
    default        xui;
}

upstream shop {
    # Промежуточный хоп, он добавляет PROXY-протокол. 8443 не берём:
    # его на этой машине держит веб-панель x-ui.
    server 127.0.0.1:8542;
}

upstream xui {
    # Инбаунд x-ui после переезда с 443.
    server 127.0.0.1:8444;
}

upstream remnanode {
    # Инбаунд ноды Remnawave, порт задан в её панели.
    server 127.0.0.1:9443;
}

server {
    listen 443 reuseport;
    listen [::]:443 reuseport;

    ssl_preread on;
    proxy_pass $backend_443;

    # Панели держат длинные соединения, обрывать их нельзя.
    proxy_timeout 10m;
    proxy_connect_timeout 5s;
}

# Промежуточный хоп только для нашего трафика: добавляет PROXY-протокол,
# чтобы витрина видела адрес клиента, а не 127.0.0.1. В блоке выше его
# включить нельзя — директива не принимает переменную, и панели, которые
# PROXY-протокол не понимают, получили бы мусор в первых байтах.
server {
    listen 127.0.0.1:8542;
    proxy_pass 127.0.0.1:8543;
    proxy_protocol on;
    proxy_timeout 75s;
}
