{# Поднавигация раздела Remnawave: active ∈ ('dashboard','profiles','balancer','settings') #}
<div class="flex flex-wrap items-center gap-2 mb-3">
  <a href="{{ url_for('admin.remnawave_dashboard') }}"
     class="tw-btn tw-btn-sm gap-1.5 {% if active == 'dashboard' %}tw-btn-primary{% else %}tw-btn-secondary{% endif %}">
    <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
    Дашборд
  </a>
  <a href="{{ url_for('admin.remnawave_profiles_list') }}"
     class="tw-btn tw-btn-sm gap-1.5 {% if active == 'profiles' %}tw-btn-primary{% else %}tw-btn-secondary{% endif %}">
    <i data-lucide="layers" class="w-3.5 h-3.5"></i>
    Профили
  </a>
  {% if host_balancer_enabled|default(false) %}
  <a href="{{ url_for('admin.remnawave_host_balancer_page') }}"
     class="tw-btn tw-btn-sm gap-1.5 {% if active == 'balancer' %}tw-btn-primary{% else %}tw-btn-secondary{% endif %}">
    <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
    Балансировка хостов
  </a>
  {% endif %}
  <a href="{{ url_for('admin.remnawave_settings') }}"
     class="tw-btn tw-btn-sm gap-1.5 {% if active == 'settings' %}tw-btn-primary{% else %}tw-btn-secondary{% endif %}">
    <i data-lucide="settings" class="w-3.5 h-3.5"></i>
    Настройки
  </a>
</div>
