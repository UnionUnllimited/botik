<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
        }
        
        .error-code {
            font-size: 72px;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 16px;
            color: #666;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 500;
            color: #333;
        }
        
        p {
            font-size: 16px;
            margin-bottom: 24px;
            color: #666;
            line-height: 1.5;
        }
        
        .button {
            display: inline-block;
            padding: 10px 24px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: #fff;
            text-decoration: none;
            font-weight: 400;
            font-size: 14px;
            transition: background 0.2s ease;
        }
        
        .button:hover {
            background: #555;
        }
        
        @media (max-width: 600px) {
            .error-code {
                font-size: 56px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Страница не найдена</h1>
        <p>Запрашиваемая страница не существует.</p>
    </div>
</body>
</html>
