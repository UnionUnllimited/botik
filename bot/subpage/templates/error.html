<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка - {{ project_name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .error-container {
            background: #fff;
            border-radius: 4px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 16px;
            font-size: 24px;
            font-weight: 500;
        }
        
        .error-message {
            color: #666;
            margin-bottom: 24px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .support-link {
            display: inline-block;
            padding: 10px 24px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 400;
            font-size: 14px;
            transition: background 0.2s ease;
        }
        
        .support-link:hover {
            background: #555;
        }
        
        .project-name {
            margin-top: 24px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Ошибка</h1>
        <p class="error-message">{{ error_message }}</p>
        {% if support_url %}
        <a href="{{ support_url }}" class="support-link" target="_blank">Связаться с поддержкой</a>
        {% endif %}
        <div class="project-name">{{ project_name }}</div>
    </div>
</body>
</html>
