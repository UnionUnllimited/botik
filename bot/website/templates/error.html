{% extends "base.html" %}
{% block title %}{{ error_title }} — {{ project_name }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-12rem)] px-5 py-16">
  <div class="w-full max-w-[420px] text-center">

    <!-- Код ошибки -->
    <p class="text-[88px] sm:text-[110px] font-bold tracking-tighter leading-none text-black/[0.06] dark:text-white/[0.06] select-none mb-2">
      {{ status_code }}
    </p>

    <!-- Иконка -->
    <div class="w-14 h-14 rounded-2xl bg-black/[0.04] dark:bg-white/[0.06] flex items-center justify-center mx-auto -mt-8 mb-6 relative">
      {% if status_code == 404 %}
      <svg class="w-7 h-7 text-black/30 dark:text-white/30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"/>
      </svg>
      {% elif status_code == 403 %}
      <svg class="w-7 h-7 text-black/30 dark:text-white/30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
      </svg>
      {% else %}
      <svg class="w-7 h-7 text-black/30 dark:text-white/30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
      </svg>
      {% endif %}
    </div>

    <h1 class="text-[26px] font-bold tracking-tight text-black dark:text-white mb-3">
      {{ error_title }}
    </h1>
    <p class="text-[15px] text-black/50 dark:text-white/50 leading-relaxed mb-10">
      {{ error_message }}
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="/"
         class="inline-flex items-center gap-2 bg-black dark:bg-white text-white dark:text-black text-[14px] font-semibold px-6 py-3 rounded-full hover:opacity-80 active:scale-[0.98] transition-all duration-200">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
        На главную
      </a>
      <button onclick="history.back()"
              class="inline-flex items-center gap-2 border border-black/[0.1] dark:border-white/[0.1] text-black/60 dark:text-white/60 text-[14px] font-medium px-6 py-3 rounded-full hover:bg-black/[0.04] dark:hover:bg-white/[0.06] hover:text-black dark:hover:text-white active:scale-[0.98] transition-all duration-200">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
        Назад
      </button>
    </div>

  </div>
</div>
{% endblock %}
