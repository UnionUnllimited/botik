<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pastel_gray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9CA3AF; stop-opacity:1" />
    </linearGradient>

    <filter id="text_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6B7280" flood-opacity="0.25" />
    </filter>

    <filter id="box_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.08" />
    </filter>
	
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#ffffff" filter="url(#box_shadow)" />
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="320" fill="url(#pastel_gray)" filter="url(#text_shadow)">W</text>
</svg>