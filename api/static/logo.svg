<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Titan Routers">
  <!-- Знак витрины: буква T и две волны Wi-Fi по бокам. Векторный, а не PNG:
       он нужен в шапке (24 px) и во вкладке браузера (16 px), а растр
       на таких размерах мылит. Оператор может заменить своим файлом
       настройкой landing.logo_url — тогда сюда никто не смотрит. -->
  <defs>
    <linearGradient id="titan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="16" fill="#0b1220" stroke="#1e2b45"/>

  <!-- Буква T -->
  <path d="M18 19h28v7.5H36.2V46h-8.4V26.5H18z" fill="url(#titan)"/>

  <!-- Волны: слева и справа, как антенны у роутера -->
  <g fill="none" stroke="url(#titan)" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <path d="M12.5 26.5a7.5 7.5 0 0 0 0 11"/>
    <path d="M7.5 22.5a13.5 13.5 0 0 0 0 19"/>
    <path d="M51.5 26.5a7.5 7.5 0 0 1 0 11"/>
    <path d="M56.5 22.5a13.5 13.5 0 0 1 0 19"/>
  </g>
</svg>
