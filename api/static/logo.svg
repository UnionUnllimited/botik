<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Titan Routers">
  <!-- Знак в шапке: только буква, без роутеров и волн.
       В строке высотой 32 px мелкие детали сливаются в кашу, а буква
       читается и на телефоне. Полная композиция живёт в favicon.svg.
       Оператор может заменить файл настройкой landing.logo_url. -->
  <defs>
    <linearGradient id="letter" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Перекладина со срезанным правым краем и ножка: та же форма,
       что на присланном знаке. -->
  <path d="M8 10h48l-6.5 12H38v32H26V22H8z" fill="url(#letter)"/>
  <path d="M8 10h48l-6.5 12H38v32H26V22H8z" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
  <!-- Вырез в перекладине — он и делает букву объёмной. -->
  <path d="M17 14h30l-3 5H17z" fill="#0b1220" opacity="0.75"/>
</svg>
