<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Titan Routers</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/static/fonts/rubik-cyrillic.woff2">
<link rel="stylesheet" href="/static/miniapp/app.css?v=9">
</head>
<body>

<!-- Набор иконок. Свой и один на всё приложение: смешивать эмодзи с обводкой
     нельзя, а тянуть чужой шрифт значков — значит поставить экран клиента в
     зависимость от чужого адреса, который из России может и не ответить.
     Все нарисованы по одной сетке 24x24, обводка 2, концы скруглены. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="s" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"/>
  </symbol>

  <symbol id="i-router" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="13" width="18" height="8" rx="2.5"/>
    <path d="M7 17h.01M10.5 17h.01"/><path d="M12 13V9"/>
    <path d="M8.5 5.5 12 9l3.5-3.5"/>
  </symbol>

  <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8.2 12 3.5l9 4.7v7.6L12 20.5 3 15.8z"/>
    <path d="M3 8.2 12 13l9-4.8M12 13v7.5"/>
  </symbol>

  <symbol id="i-receipt" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h12v18l-3-1.8L12 21l-3-1.8L6 21z"/><path d="M9.5 8.5h5M9.5 12.5h5"/>
  </symbol>

  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.2 19 6v5.8c0 4.4-2.9 7.8-7 9-4.1-1.2-7-4.6-7-9V6z"/>
    <path d="M9.2 12.2 11.3 14.3 15 10.6"/>
  </symbol>

  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4v5.2h-5.2"/>
  </symbol>

  <symbol id="i-card" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.8h19M6.5 15h3"/>
  </symbol>

  <symbol id="i-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 7.5h11v9h-11z"/><path d="M13.5 10.5h4l3 3v3h-7z"/>
    <circle cx="7" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/>
  </symbol>

  <symbol id="i-chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 5.5 16 12l-6.5 6.5"/>
  </symbol>

  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.5 9.5 17.5 19.5 7"/>
  </symbol>

  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.8"/><path d="M12 7.6v5M12 16.2h.01"/>
  </symbol>

  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.8"/><path d="M12 11v5.4M12 7.8h.01"/>
  </symbol>

  <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.2 9.4a11 11 0 0 1 15.6 0"/><path d="M7.4 12.8a6.5 6.5 0 0 1 9.2 0"/>
    <path d="M10.6 16.2a2 2 0 0 1 2.8 0"/><path d="M12 19.4h.01"/>
  </symbol>

  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.8"/><path d="M12 7.2V12l3.2 2"/>
  </symbol>

  <symbol id="i-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.6 17.5a9 9 0 1 1 16.8 0"/><path d="M12 13.5 16 9.8"/>
  </symbol>

  <symbol id="i-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.5h13M13.5 5 17 8.5 13.5 12"/><path d="M20 15.5H7M10.5 12 7 15.5 10.5 19"/>
  </symbol>

  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v11"/><path d="M7.8 10.3 12 14.5l4.2-4.2"/><path d="M4.5 19.5h15"/>
  </symbol>

  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="11.5" height="11.5" rx="2.5"/>
    <path d="M15 5.5a2.5 2.5 0 0 0-2.5-2.5h-6A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/>
  </symbol>

  <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v8"/><path d="M6.7 7.2a7.8 7.8 0 1 0 10.6 0"/>
  </symbol>

  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12.4c0 4-3.8 7.2-8.5 7.2-1 0-2-.15-2.9-.42L4 20.5l1.5-3.6C4.2 15.65 3.5 14.1 3.5 12.4c0-4 3.8-7.2 8.5-7.2s8.5 3.2 8.5 7.2z"/>
  </symbol>

  <symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 4.5h2.2l2.3 10.2h9.6l2.1-7.4H6.2"/>
    <circle cx="9" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/>
  </symbol>
</svg>

<!-- Заставка. Стоит в разметке, а не рисуется скриптом: между открытием
     приложения и первым ответом сервера проходит секунда-полторы, и всё это
     время клиент смотрел на пустоту. Скрипт её только убирает — если он
     не загрузится вовсе, заставка уйдёт по таймеру, а не останется навсегда. -->
<div id="splash">
  <div class="mark"><img src="/app/logo" alt="" width="72" height="72"></div>
  <div class="word">TITAN ROUTERS</div>
  <div class="bar"><i></i></div>
</div>

<div class="wrap" id="screen"></div>

<!-- Значок в плашке, а не сам по себе: плашка подсвечивается у выбранной
     вкладки и заменяет собой подчёркивание. -->
<nav id="nav">
  <button data-tab="home"><span class="slot"><svg><use href="#i-user"/></svg></span>Профиль</button>
  <button data-tab="router"><span class="slot"><svg><use href="#i-router"/></svg></span>Роутер</button>
  <button data-tab="orders"><span class="slot"><svg><use href="#i-receipt"/></svg></span>Заказы</button>
  <button data-tab="catalog"><span class="slot"><svg><use href="#i-box"/></svg></span>Каталог</button>
</nav>

<script src="/static/miniapp/app.js?v=9"></script>
</body>
</html>
