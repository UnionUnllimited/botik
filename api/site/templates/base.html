<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ brand }}{% endblock %} · {{ brand }}</title>
<style>
/* Ничего не тянется с CDN: сайт открывают в том числе там, где внешние домены недоступны. */
:root {
  --bg: #fbfbfd;
  --card: #ffffff;
  --line: #e6e8ee;
  --line-soft: #f0f1f5;
  --text: #101322;
  --muted: #656d80;
  --accent: #3355ff;
  --accent-dark: #2340d9;
  --ink: #0b0f1e;
  --ok: #0b8a52;
  --warn: #9a6208;
  --bad: #c32626;
  --shadow: 0 1px 2px rgba(16, 19, 34, 0.04), 0 8px 24px rgba(16, 19, 34, 0.06);
  --shadow-lg: 0 2px 6px rgba(16, 19, 34, 0.06), 0 24px 48px rgba(16, 19, 34, 0.10);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-dark); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }

/* ------------------------------------------------------------------ шапка */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 22px; height: 66px; }
.logo { display: flex; align-items: center; gap: 9px; font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.logo:hover { color: var(--text); }
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: linear-gradient(135deg, var(--accent), #7b5cff);
  display: flex; align-items: center; justify-content: center;
}
nav.top-nav { margin-left: auto; display: flex; gap: 20px; align-items: center; }
nav.top-nav a { color: var(--muted); font-size: 15px; font-weight: 500; }
nav.top-nav a:hover { color: var(--text); }
nav.top-nav a.active { color: var(--text); font-weight: 600; }

main { padding: 44px 0 80px; }
h1 { font-size: 34px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.03em; font-weight: 750; }
h2 { font-size: 24px; margin: 0 0 16px; letter-spacing: -0.02em; font-weight: 700; }
h3 { font-size: 17px; margin: 0 0 6px; font-weight: 650; }
p.lead { color: var(--muted); margin: 0 0 30px; font-size: 17.5px; max-width: 62ch; }
section { margin-bottom: 64px; }
.section-head { margin-bottom: 24px; }
.section-head p { color: var(--muted); margin: 0; }

/* ------------------------------------------------------------------ блоки */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 18px; }
.grid { display: grid; gap: 20px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }

.price { font-size: 25px; font-weight: 750; letter-spacing: -0.02em; }
.price .old { font-size: 15px; font-weight: 400; color: var(--muted); text-decoration: line-through; margin-left: 9px; }
.per-month { color: var(--muted); font-size: 14px; }

.badge {
  display: inline-block; padding: 3px 11px; border-radius: 20px;
  font-size: 13px; font-weight: 600; background: #eef0f6; color: var(--muted);
}
.badge.ok { background: #e4f6ec; color: var(--ok); }
.badge.warn { background: #fdf3e0; color: var(--warn); }
.badge.bad { background: #fdeaea; color: var(--bad); }
.badge.info { background: #e9edff; color: var(--accent); }

.btn {
  display: inline-block; padding: 12px 22px; border-radius: 11px; border: 0;
  background: var(--accent); color: #fff; font: inherit; font-weight: 600;
  cursor: pointer; text-align: center; transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 14px rgba(51, 85, 255, 0.24);
}
.btn:hover { background: var(--accent-dark); color: #fff; transform: translateY(-1px); }
.btn.ghost { background: #fff; color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow); }
.btn.ghost:hover { background: #fff; color: var(--text); border-color: #ccd2e0; }
.btn.wide { display: block; width: 100%; }
.btn[disabled] { background: #dfe3ec; color: #8b93a5; box-shadow: none; cursor: not-allowed; transform: none; }
.btn.small { padding: 8px 15px; font-size: 14px; box-shadow: none; }

/* ------------------------------------------------------------------ формы */
form.stack label { display: block; margin-bottom: 18px; font-size: 14px; font-weight: 500; color: var(--muted); }
form.stack input {
  display: block; width: 100%; margin-top: 7px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 11px; font: inherit; color: var(--text);
  background: #fff; transition: border-color 0.15s, box-shadow 0.15s;
}
form.stack input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(51, 85, 255, 0.15);
}
.narrow { max-width: 430px; margin: 0 auto; }

.error {
  background: #fdeaea; border: 1px solid #f6cccc; color: var(--bad);
  padding: 12px 15px; border-radius: 11px; margin-bottom: 20px; font-size: 15px;
}
.notice {
  background: #e9edff; border: 1px solid #cfd8ff; color: var(--accent-dark);
  padding: 12px 15px; border-radius: 11px; margin-bottom: 20px; font-size: 15px;
}

table.rows { width: 100%; border-collapse: collapse; font-size: 15px; }
table.rows th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; padding: 0 14px 10px 0; }
table.rows td { padding: 12px 14px 12px 0; border-top: 1px solid var(--line-soft); }

dl.facts { display: grid; grid-template-columns: minmax(150px, auto) 1fr; gap: 10px 22px; margin: 0; }
dl.facts dt { color: var(--muted); font-size: 14px; }
dl.facts dd { margin: 0; }

.empty { color: var(--muted); }

footer.bottom { border-top: 1px solid var(--line); padding: 32px 0; color: var(--muted); font-size: 14px; background: var(--card); }
footer.bottom .wrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }

/* Приманка для ботов: человек её не видит, автозаполнение сюда не лезет. */
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

@media (max-width: 600px) {
  header.top .wrap { height: auto; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; gap: 12px; }
  nav.top-nav { margin-left: 0; width: 100%; gap: 16px; }
  h1 { font-size: 27px; }
  h2 { font-size: 21px; }
  main { padding: 28px 0 56px; }
  section { margin-bottom: 48px; }
}
{% block extra_css %}{% endblock %}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/">
      <span class="logo-mark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 9.5h12v4H2z" fill="#fff" opacity=".95"/>
          <path d="M8 9V6M5 4.5a4.2 4.2 0 0 1 6 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      {{ brand }}
    </a>
    <nav class="top-nav">
      <a href="/" {% if current_path == '/' %}class="active"{% endif %}>Роутеры</a>
      {% if client %}
        <a href="/cabinet" {% if current_path == '/cabinet' %}class="active"{% endif %}>Кабинет</a>
        <form method="post" action="/logout" style="display:inline">
          <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
          <button type="submit" class="btn ghost small">Выйти</button>
        </form>
      {% else %}
        <a href="/login" {% if current_path == '/login' %}class="active"{% endif %}>Войти</a>
        <a href="/register" class="btn small">Регистрация</a>
      {% endif %}
    </nav>
  </div>
</header>

<main>
  {% block page %}
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
  {% endblock %}
</main>

<footer class="bottom">
  <div class="wrap">
    <span>{{ brand }} — роутеры с подпиской на сервис стабильного доступа к зарубежным ресурсам.</span>
  </div>
</footer>
</body>
</html>
