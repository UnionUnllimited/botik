<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход · {{ brand }}</title>
<style>
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: #0f1115; color: #e6e8ee;
  font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.box { width: 340px; max-width: 92vw; background: #171a21; border: 1px solid #2a2f3a;
  border-radius: 12px; padding: 26px; }
h1 { font-size: 19px; margin: 0 0 6px; }
p.sub { color: #99a0ae; font-size: 13px; margin: 0 0 18px; }
label { display: block; color: #99a0ae; font-size: 13px; margin: 14px 0 4px; }
input { width: 100%; background: #1e222b; border: 1px solid #2a2f3a; color: #e6e8ee;
  border-radius: 8px; padding: 10px; font: inherit; }
input:focus { outline: 1px solid #4c8dff; }
button { width: 100%; margin-top: 20px; background: #4c8dff; border: none; color: #fff;
  padding: 11px; border-radius: 8px; font: inherit; cursor: pointer; }
.err { margin-top: 16px; background: #2b1414; border: 1px solid #5e2626; color: #ff5c5c;
  padding: 10px 12px; border-radius: 8px; font-size: 14px; }
.hint { margin-top: 16px; color: #99a0ae; font-size: 12px; }
</style>
</head>
<body>
<form class="box" method="post" action="{{ action }}">
  <h1>{{ title }}</h1>
  <p class="sub">{{ subtitle }}</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  {% if stage == 'password' %}
    <label for="login">Логин</label>
    <input id="login" name="login" autocomplete="username" autofocus required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  {% else %}
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
    <label for="code">Код из приложения</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9]*" maxlength="6" autofocus required>
  {% endif %}

  <button type="submit">{{ submit }}</button>
  {% if hint %}<div class="hint">{{ hint }}</div>{% endif %}
</form>
</body>
</html>
